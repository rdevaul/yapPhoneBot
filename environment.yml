name: yapPhoneBot

channels:
  - conda-forge

platforms:
  - linux-64
  - osx-arm64

dependencies:
  - python=3.11
  - numpy>=1.22
  - pip
  - scipy

  # OpenCASCADE is optional for SDF-first builds.
  # Install for analytic BREP / STEP export:
  # - pythonocc-core=7.7

  - pip:
    # yapCAD main (1.2.0+) with SDF geometry system.
    - "yapCAD[meshcheck] @ git+https://github.com/rdevaul/yapCAD.git@b806f813339908ec7dc67fd7d6143e1e40f9ba08"
