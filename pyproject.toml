[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yapPhoneBot"
version = "0.1.0"
description = "A yapCAD procedural CAD model of the PhoneBot humanoid robot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Richard DeVaul", email = "richard.devaul@gmail.com" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.22",
  # yapCAD main (1.2.0+): SDF geometry, mesh booleans, assemblies, .ycpkg.
  "yapCAD[meshcheck] @ git+https://github.com/rdevaul/yapCAD.git@12bbe93539e9d7c0a5189205486212c0d35178b9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/rdevaul/yapPhoneBot"
Issues = "https://github.com/rdevaul/yapPhoneBot/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "requires_occ: requires pythonocc-core and analytic BREP support",
  "expensive_geometry: slow exact geometry validation",
  "visual: interactive or manually inspected output",
]
